name: Documentation
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag a republicar (ex.: v0.1.2). Deixe em branco para publicar a doc
          de desenvolvimento (dev) a partir da ref escolhida.
        required: false
        default: ''
permissions:
  contents: write
  pull-requests: read
  statuses: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Instala dependências da doc
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build e deploy (gh-pages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          DOCS_DEPLOY_TAG: ${{ inputs.tag }}
        run: julia --project=docs docs/make.jl
